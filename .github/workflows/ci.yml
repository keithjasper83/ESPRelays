name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    # Self-hosted by default. Optional override via repository variable CI_RUNNER.
    # Examples:
    #   ["self-hosted","linux"]
    #   ["self-hosted","macOS"]
    # Leave CI_RUNNER unset to use generic self-hosted.
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'self-hosted' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install --upgrade platformio gcovr

      - name: Test actual image partition guard
        run: python -m unittest discover -s test/build_guard -v

      - name: Build firmware
        run: pio run

      - name: Verify firmware identity and OTA contract
        run: |
          grep -Eq 'FIRMWARE_VERSION\[] = "[0-9]+\.[0-9]+\.[0-9]+"' src/AppConfig.h
          grep -q 'FIRMWARE_RELEASE_DATE\[]' src/AppConfig.h
          grep -q 'firmware-esp32-c3-devkitm-1.bin' src/AppConfig.h

      - name: Run host tests
        if: runner.os == 'Linux'
        run: pio test -vvv -e native

      - name: Skip host tests on non-Linux runners
        if: runner.os != 'Linux'
        run: echo "Skipping native host tests on ${RUNNER_OS}; gcov linking is Linux-only in this workflow."

      - name: Setup Node for embedded console tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test embedded web console
        run: node --test test/web/*.test.cjs

      - name: Enforce coverage gate
        if: runner.os == 'Linux'
        run: |
          gcovr \
            --root . \
            --object-directory .pio/build/native \
            --filter src/CommandRouter.cpp \
            --filter src/DeviceCommands.cpp \
            --xml-pretty \
            --output coverage.xml \
            --html-details coverage.html \
            --fail-under-line 90

      - name: Skip coverage gate on non-Linux runners
        if: runner.os != 'Linux'
        run: echo "Skipping coverage gate on ${RUNNER_OS}; native gcov coverage is Linux-only in this workflow."

      - name: Upload coverage artifacts
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          retention-days: 10
          path: |
            coverage.xml
            coverage.html
